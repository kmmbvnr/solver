[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "shiftopt"
version = "0.1.0"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
description = "Embeddable linear optimization and resource-constrained candidate selection"
requires-python = ">=3.10"
dependencies = ["highspy>=1.16,<2", "numpy>=1.24", "scipy>=1.11"]

[project.optional-dependencies]
mip-quadratic = ["pyscipopt>=6,<7"]
mip-gpu = ["torch>=2.4,<3"]
dimacs-conic = ["cvxpy>=1.5,<2", "scs>=3.2,<4"]
roadef = ["ijson>=3.2,<4", "numba>=0.61", "ortools>=9.12,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shiftopt = ["native/*.rs"]
